services:
  # Infrastructure services
  minio:
    image: minio/minio
    container_name: bdm_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio123456
    volumes:
      - ./data/minio:/data
    command: server /data --console-address ":9001"
  
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: bdm_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,ANYWHERE:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,ANYWHERE://localhost:9092'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,ANYWHERE://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
  
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: bdm_clickhouse
    ports:
      - "8123:8123" # HTTP interface
      - "9000:9000" # native client interface
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - ./data/clickhouse:/var/lib/clickhouse
      - ./data/clickhouse/logs:/var/log/clickhouse-server
    restart: always
  
  mongodb:
    image: mongo:7.0
    container_name: bdm_mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PWD}
    volumes:
      - ./data/mongodb:/data/db
    restart: always
  
  wearable-api: 
    build:
      context: .
      dockerfile: docker/wearable_api/Dockerfile
    container_name: wearable_source_producer
    restart: always
    depends_on:
      - kafka
    volumes:
      - ./src:/app/src
    environment:
      - PYTHONPATH=/app
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - WEARABLE_TOPIC=wearable.readings
      - WEARABLE_PUBLISH_INTERVAL_SEC=1
      - KAFKA_CLIENT_ID=wearable-producer
      - PYTHONUNBUFFERED=1
    command: python -m src.landing_zone.producers.wearable_producer

  weather-proxy:
    build:
      context: .
      dockerfile: docker/pipeline/Dockerfile
    env_file:
      - .env
    container_name: weather_source_proxy
    restart: always
    depends_on:
      - kafka
    volumes:
      - ./src:/app/src
    environment:
      - PYTHONPATH=/app
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - WEATHER_TOPIC=weather.readings
      - WEATHER_PUBLISH_INTERVAL_SEC=60
      - KAFKA_CLIENT_ID=weather-producer
      - PYTHONUNBUFFERED=1
    command: python -m src.landing_zone.producers.weather_producer

  wearable-aggregator:
    build:
      context: .
      dockerfile: docker/pipeline/Dockerfile
    env_file:
      - .env
    container_name: wearable_aggregator_runtime
    restart: always
    depends_on:
      - minio
      - kafka
      - wearable-api
    volumes:
      - ./src:/app/src
    environment:
      - PYTHONPATH=/app
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - WEARABLE_TOPIC=wearable.readings
      - WEARABLE_AGG_GROUP=wearable-aggregator-1m
      - WEARABLE_OFFSET_RESET=latest
      - WARM_INTERVAL_SEC=2
      - WARM_WINDOW_MINUTES=2
      - PYTHONUNBUFFERED=1
    command: python -m src.landing_zone.run_wearable_aggregator

  airflow:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    container_name: bdm_airflow
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - minio
      - kafka
      - clickhouse
      - mongodb
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
    environment:
      - PYTHONPATH=/opt/airflow
      - AIRFLOW_HOME=/opt/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS=airflow:ADMIN
      - AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE=/opt/airflow/simple_auth_manager_passwords.json
      - AIRFLOW_SIMPLE_AUTH_USERNAME=airflow
      - AIRFLOW_SIMPLE_AUTH_PASSWORD=airflow
      - PYTHONUNBUFFERED=1
    # We need to change the user and password to the ones above to be able to login to the Airflow UI.
    command: >
      bash -lc 'printf "{\"%s\":\"%s\"}\n" "$$AIRFLOW_SIMPLE_AUTH_USERNAME" "$$AIRFLOW_SIMPLE_AUTH_PASSWORD" > "$$AIRFLOW_HOME/simple_auth_manager_passwords.json" && airflow standalone'